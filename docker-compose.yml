services:
  mysql:
    image: mysql:8.4
    container_name: digital-wallet-mysql
    environment:
      MYSQL_DATABASE: digital_wallet
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: digital-wallet-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/digital_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: password
      JWT_SECRET: change-this-demo-secret-change-this-demo-secret
      SEED_DATA_ENABLED: true
    ports:
      - "8080:8080"

volumes:
  mysql-data:
